
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .login-box {
            background: white;
            padding: 30px;
            width: 340px;
            border-radius: 12px;
            box-shadow: 0 4px 20px #0002;
        }
        h2 { text-align: center; color: #173b73; }
        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0 16px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #173b73;
            color: white;
            border: 0;
            cursor: pointer;
        }
        a { display: block; margin-top: 18px; text-align: center; }
        .error { color: #c00; }
    </style>
</head>
<body>
<div class="login-box">
    <h2>Admin Login</h2>

    {% for category, message in get_flashed_messages(with_categories=true) %}
        <p class="{{ category }}">{{ message }}</p>
    {% endfor %}

    <form method="POST">
        <label>Email</label>
        <input type="email" name="email" required>

        <label>Password</label>
        <input type="password" name="password" required>

        <button type="submit">Login as Admin</button>
    </form>

    <a href="{{ url_for('login') }}">User Login</a>
</div>
</body>
</html>
